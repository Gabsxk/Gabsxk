<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 305" width="1200" height="305" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">GitHub contribution calendar</title>
<desc id="svgDesc">Original contribution heatmap from GitHub; waiting for first sync.</desc>


<defs>
  <linearGradient id="bg-activity-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F6F8FC" />
    <stop offset="100%" stop-color="#E9F1F8" />
  </linearGradient>
  <linearGradient id="accent-activity-light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#007F78"/>
    <stop offset="100%" stop-color="#6652C8"/>
  </linearGradient>
  <radialGradient id="halo-activity-light">
    <stop offset="0%" stop-color="#6652C8" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#6652C8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid-activity-light" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#CFDBE5" stroke-width="1" opacity="0.35"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="1199" height="304" rx="23" fill="url(#bg-activity-light)" stroke="#CFDBE5"/>
<text x="44" y="48" font-family="'DejaVu Sans',Arial,sans-serif" font-size="20" fill="#17273B" font-weight="700" letter-spacing="1">THE CONTRIBUTION TRAIL</text>
<text x="846" y="48" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#5B7184" font-weight="700">ROLLING 12 MONTHS</text>
<path d="M44 71 H1156" stroke="#CFDBE5"/>
<text x="46" y="165" font-family="'DejaVu Sans',Arial,sans-serif" font-size="62" fill="#17273B" font-weight="800">—</text>
<text x="47" y="193" font-family="'DejaVu Sans',Arial,sans-serif" font-size="13" fill="#5B7184" font-weight="700" letter-spacing="1.2">CONTRIBUTIONS</text>
<text x="47" y="249" font-family="'DejaVu Sans',Arial,sans-serif" font-size="28" fill="#007F78" font-weight="800">—</text>
<text x="100" y="249" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#5B7184" font-weight="700" letter-spacing="1">ACTIVE DAYS</text>

<rect x="294" y="103" width="835" height="124" rx="10" fill="#FFFFFF" stroke="#CFDBE5" stroke-dasharray="6 8"/>
<text x="360" y="170" font-family="'DejaVu Sans',Arial,sans-serif" font-size="19" fill="#5B7184" font-weight="600">Contribution grid appears after the first sync</text>
<text x="945" y="263" font-family="'DejaVu Sans',Arial,sans-serif" font-size="11" fill="#5B7184" font-weight="700">LESS</text>
<rect x="1019" y="252" width="14" height="14" rx="3" fill="#E2EAF1"/><rect x="1043" y="252" width="14" height="14" rx="3" fill="#B9E4DA"/><rect x="1067" y="252" width="14" height="14" rx="3" fill="#77CABA"/><rect x="1091" y="252" width="14" height="14" rx="3" fill="#30A88F"/><rect x="1115" y="252" width="14" height="14" rx="3" fill="#007F78"/>
<text x="1138" y="263" font-family="'DejaVu Sans',Arial,sans-serif" font-size="11" fill="#5B7184" font-weight="700">MORE</text>
<path d="M44 282 H1156" stroke="#CFDBE5"/>
<text x="45" y="297" font-family="'DejaVu Sans',Arial,sans-serif" font-size="10" fill="#5B7184" font-weight="700" letter-spacing="0.8">WAITING FOR FIRST SYNC  /  GITHUB ACTIONS</text>

</svg>
