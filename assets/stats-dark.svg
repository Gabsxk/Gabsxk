<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">GitHub profile statistics</title>
<desc id="svgDesc">Four numerical metrics generated from public GitHub API data, refreshed daily.</desc>


<defs>
  <linearGradient id="bg-stats-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080E1D" />
    <stop offset="100%" stop-color="#101B31" />
  </linearGradient>
  <linearGradient id="accent-stats-dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#64F0CC"/>
    <stop offset="100%" stop-color="#B49BFF"/>
  </linearGradient>
  <radialGradient id="halo-stats-dark">
    <stop offset="0%" stop-color="#B49BFF" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#B49BFF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid-stats-dark" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#29415A" stroke-width="1" opacity="0.35"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="1199" height="269" rx="23" fill="url(#bg-stats-dark)" stroke="#29415A"/>
<text x="43" y="48" font-family="'DejaVu Sans',Arial,sans-serif" font-size="20" fill="#F2F8FF" font-weight="700" letter-spacing="1">05  /  THE GITHUB SIGNAL</text>
<circle cx="1117" cy="41" r="5" fill="#64F0CC"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
<text x="944" y="47" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#8FA8BE" font-weight="700" letter-spacing="1">DAILY SNAPSHOT</text>
<path d="M43 75 H1157" stroke="#29415A"/>
<rect x="43" y="104" width="266" height="127" rx="14" fill="#14243A" stroke="#29415A"/>
<path d="M61 125 h36" stroke="#64F0CC" stroke-width="4" stroke-linecap="round"/>
<text x="61" y="192" font-family="'DejaVu Sans',Arial,sans-serif" font-size="49" fill="#F2F8FF" font-weight="800">—</text>
<text x="61" y="217" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#8FA8BE" font-weight="700" letter-spacing="1.1">PUBLIC REPOSITORIES</text>
<rect x="325" y="104" width="266" height="127" rx="14" fill="#14243A" stroke="#29415A"/>
<path d="M343 125 h36" stroke="#B49BFF" stroke-width="4" stroke-linecap="round"/>
<text x="343" y="192" font-family="'DejaVu Sans',Arial,sans-serif" font-size="49" fill="#F2F8FF" font-weight="800">—</text>
<text x="343" y="217" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#8FA8BE" font-weight="700" letter-spacing="1.1">STARS RECEIVED</text>
<rect x="607" y="104" width="266" height="127" rx="14" fill="#14243A" stroke="#29415A"/>
<path d="M625 125 h36" stroke="#64F0CC" stroke-width="4" stroke-linecap="round"/>
<text x="625" y="192" font-family="'DejaVu Sans',Arial,sans-serif" font-size="49" fill="#F2F8FF" font-weight="800">—</text>
<text x="625" y="217" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#8FA8BE" font-weight="700" letter-spacing="1.1">CONTRIBUTIONS / YEAR</text>
<rect x="889" y="104" width="266" height="127" rx="14" fill="#14243A" stroke="#29415A"/>
<path d="M907 125 h36" stroke="#B49BFF" stroke-width="4" stroke-linecap="round"/>
<text x="907" y="192" font-family="'DejaVu Sans',Arial,sans-serif" font-size="49" fill="#F2F8FF" font-weight="800">—</text>
<text x="907" y="217" font-family="'DejaVu Sans',Arial,sans-serif" font-size="12" fill="#8FA8BE" font-weight="700" letter-spacing="1.1">FOLLOWERS</text>
<text x="44" y="254" font-family="'DejaVu Sans',Arial,sans-serif" font-size="11" fill="#8FA8BE" font-weight="600" letter-spacing="1">AWAITING FIRST GITHUB ACTIONS SYNC</text>

</svg>
